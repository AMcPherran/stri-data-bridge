# Builds ghcr.io/amcpherran/stri-data-bridge:sha-<short> on each push to main. Production
# deploys the newest such tag automatically, so only main pushes: an unmerged branch never ships.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/amcpherran/stri-data-bridge:sha-${{ steps.tag.outputs.short }}
          labels: org.opencontainers.image.source=https://github.com/AMcPherran/stri-data-bridge
